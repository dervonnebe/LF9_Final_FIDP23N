name: CI/CD Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build with Maven
    runs-on: ubuntu-latest
    container:
      image: maven:latest
    env:
      MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
      MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Maven dependencies
        run: mvn dependency:go-offline

      - name: Build Project
        run: mvn package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-jar
          path: target/todo-todo-jar-with-dependencies.jar

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write   # Wichtig für GHCR Push
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$(basename ${{ github.repository }})-rest-api
          docker build -t ghcr.io/dervonnebe/lf9_final_fidp23n-rest-api:${{ github.sha }} .

      - name: Push Docker Image to GHCR
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$(basename ${{ github.repository }})-rest-api
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
